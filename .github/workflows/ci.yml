name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify env template exists
        run: test -f .env.example

      - name: Verify secrets are not committed
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.local$|^\.env\.production'; then
            echo "Secret env file tracked by git!"
            exit 1
          fi

  build:
    name: Build & test
    runs-on: ubuntu-latest
    needs: repo-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        continue-on-error: true

      - name: Start Postgres for migrate
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U postgres -d edareview; then
              break
            fi
            sleep 1
          done

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:54320/edareview
          PAYLOAD_SECRET: ci-placeholder-secret-min-32-chars-long
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
